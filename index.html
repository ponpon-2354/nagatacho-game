 (ef.match(/[a-z]-?\d+/g)||[]).forEach(x=>{let k=x[0],v=+x.slice(1);if(k=='r'){S.push(v?'与党入り':'野党の立場');return}if(!K[k]&&k!='w')return;

  if(s&&k=='f'&&s.fac==5)return;if(s&&s.out&&v>0){if(k=='d')return;if('ipo'.includes(k))v=Math.ceil(v/2)}T[k]=(T[k]||0)+v});

 return `<span class=hn>${S.length?`<i class=up>短期 ${S.join('・')}</i>`:''}${Lg.length?`<i class=up>長期 ${Lg.join('・')}</i>`:''}${D.length?`<i class=dn>デメリット ${D.join('・')}</i>`:''}${F.length?`<i class=nt>${F.join('・')}</i>`:''}${ex?`<i class=nt>${esc(ex)}</i>`:''}${!S.length&&!Lg.length&&!D.length&&!F.length&&!ex?'<i class=nt>ステータスの変化なし</i>':''}</span>`}

${x[1]?`<div class=pc><div class=pro><h4>賛成の意見</h4><p>${esc(x[1])}</p></div><div class=con><h4>反対の意見</h4><p>${esc(x[2])}</p></div></div>`:''}
${e.f&&!e.sel&&x[0]!=e.f?`<details class=sm><summary>史実メモ</summary><p class=mu>${esc(e.f)}</p></details>`:''}
${e.sel?(e.dir!=null?`<div class=al>${e.ifsel?'':tag('史実')}派閥(${fnm(s.fac)})の幹部から「${esc(e.sel[e.dir])}氏に投票するように」と指示がありました${e.ifsel?'(IF)':'(史実でもこの派閥は'+esc(e.sel[e.dir])+'氏を支持しました)'}。指示に背くと、派閥から冷遇されたり除籍されたりします。</div>`:(!e.ifsel&&s.fac<5&&!isLeader())?`<div class=al>${tag('史実')}史実でこの派閥(${fnm(s.fac)})の統一した支持方針は確認できないため、派閥からの指示はありません(自主投票)。</div>`:isLeader()?`<div class="al e">あなたは${pname(s.pos.f)}として派閥の投票方針を決められます。あなたが選んだ候補に、派閥の票がまとまって入ります。</div>`:s.fac==5?'<div class=al>無派閥のため、投票先は自由に決められます。</div>':''):''}<h4 class=q>あなたはどう動きますか? <small>(1つ選択)</small></h4>
${(()=>{let bs=blks(e.o),ab=false;return e.o.map((o,i)=>{let b=bs[i];return `<label class="o${s.pick===i?' sel':''}${b.length?' dis':''}"><input type=radio name=q ${s.pick===i?'checked':''} ${b.length?'disabled':''} onclick="pk(${i})"><span class=lt>${L[i]}</span><span class=ot><span>${esc(o[0])}</span>${hint(o[1])}${b.length?`<span class=xn>選べません:${b.join('・')}が0です</span>`:''}</span></label>`}).join('')+(ab?'<p class=nt>すべての選択肢で0のステータスが下がるため、今回は特例ですべて選べます。</p>':'')})()}
<p class=nt>※矢印は主な影響の方向です。実際の結果は情勢や運で変わります。</p></section>`;
 if(jc)h+=`<section class="cd job"><h3>${esc(jc.t)} <small>(1つ選択)</small></h3><p class=mu>役職に就いている間は、毎ターンその立場ならではの行動を選べます。</p>${optList('jc',jc.o,s.jpick,'jp')}</section>`;
 if(isE(k)&&!s.ret)h+=(()=>{if(!stgOK(s.stg||0))s.stg=STG.length-1;let bc=bCost(),sp=supp(),sz=sp.L.reduce((a,x)=>a+x.z,0)+(s.out?.05:0)-(s.st.m<bc?.03:0),pc=v=>(v>=0?'+':'')+Math.round(v*100)+'%';
 return `<section class=cd><h3>選挙戦略 <small>(1つ選択)</small></h3><p class=nt>どの戦略でも、選挙費用(事務所・ポスター・運動員など)として政治資金${bc}が自動でかかります${s.st.m<bc?'。<b class=wn>いまは足りないため、当選見込みが3%下がります</b>':''}。戦略の費用はこれに加えてかかります(いまの政治資金:${s.st.m})。</p>${STG.map((g,i)=>{let d=!stgOK(i),x=STGX[i],zv=x.z(),af=x.after?hint(x.after):'',est=Math.round(winP(zv+sz)*100);
  return `<label class="o${(s.stg||0)==i?' sel':''}${d?' dis':''}"><input type=radio name=sg ${(s.stg||0)==i?'checked':''} ${d?'disabled':''} onclick="s.stg=${i};R()"><span class=ot><span><b>${g[0]}</b> <small>${esc(g[1])}</small></span><span class=hn><i class=dn>費用 政治資金↓${g[2]+bc}${g[2]?'(選挙費用'+bc+'+戦略'+g[2]+')':'(選挙費用のみ)'}</i><i class=${zv>=0?'up':'dn'}>当選見込み${pc(zv)}</i></span>${x.after?`<span class=nt>選挙後:</span>${af}`:''}<span><b>この戦略での当選見込み:約${est}%</b> <small>(応援などを含む)</small></span>${d?`<span class=xn>選べません:政治資金が足りません(必要${g[2]+bc})</span>`:''}</span></label>`}).join('')}</section>
<section class=cd><h3>選挙の応援 <small>(自動)</small></h3>${sp.L.length?`<ul class=ls>${sp.L.map(x=>`<li><b>${esc(x.w)}</b>が応援に入ります:当選見込み+${Math.round(x.z*100)}% <small class=mu>(${x.c})</small></li>`).join('')}</ul>`:'<p class=mu>今回は応援に入る人がいません。</p>'}${s.out?'<p>浪人中の捲土重来の戦い:当選見込み+5%</p>':''}${sp.nx.length?`<h4>条件を満たせば入る応援</h4><ul class=ls>${sp.nx.map(x=>`<li>${esc(x.w)}:当選見込み+${Math.round(x.z*100)}% <small class=mu>(${x.c})</small></li>`).join('')}</ul>`:''}<p class=nt>応援の条件は当選回数で変わります(1〜3期・4〜6期・7期以上)。${isPrez()?'総裁のあなたには、政権幹部の応援は入りません。':''}${s.left?'離党中のため、党や派閥の応援はありません。':''}</p></section>`})();
 h+=(()=>{let row=i=>{let m=M[i],on=s.mul.includes(i),b=on?[]:mBl(i);return `<label class="o${on?' sel':''}${b.length?' dis':''}"><input type=checkbox ${on?'checked':''} ${b.length?'disabled':''} onclick="tg(${i})"><span class=ot><span>${m[0]}</span>${hint(m[1],m[4])}${b.length?`<span class=xn>選べません:${b.join('・')}</span>`:''}</span></label>`},gi=M.map((m,i)=>i).filter(i=>M[i][2]!='f'&&mAvail(i)),fi=M.map((m,i)=>i).filter(i=>M[i][2]=='f'&&mAvail(i));
 return `<section class=cd><h3>追加の活動 <small>(任意・2つまで選べます／いま${s.mul.length}つ選択中)</small></h3>${s.mul.length?`<div class=row><button class=sm2 onclick="tg(-1)">追加の活動をすべて外す</button></div>`:''}<h4>議員としての活動</h4>${gi.map(row).join('')}<h4>派閥の活動 ${s.fac<5?`<small>(${esc(fnm(s.fac))})</small>`:''}</h4>${fi.length?fi.map(row).join(''):`<p class=nt>${s.left?'離党中のため派閥の活動はできません。':s.fac==5?'無派閥のため派閥の活動はありません。「派閥」タブから派閥に入れます。':'いまは派閥の活動ができません。'}</p>`}<p class=nt>表示の数値は、選んだ難易度での増減の目安です(同じ項目の増減は差し引きした結果だけを表示)。ステータスが80以上のときは伸びが小さくなります。</p></section>`})();
 h+=`<div class=db><div class=ds>${(()=>{let nd=[];if(s.pick==null)nd.push('政策課題');if(jc&&s.jpick==null)nd.push('役職の仕事');if(ic&&s.ipick==null)nd.push('出来事');if(s.fev&&s.fpick==null)nd.push('派閥の選択');return nd.length?`<b class=wn>未選択:${nd.join('・')}</b>`:`選択:<b>${L[s.pick]}</b>${jc?` ＋ 仕事${L[s.jpick]}`:''}${ic?` ＋ 出来事${L[s.ipick]}`:''}${s.mul.length?` ＋ ${s.mul.map(i=>M[i][0]).join('・')}`:''}${isE(k)&&!s.ret?` ＋ ${STG[s.stg||0][0]}`:''}`})()}</div>${s.pick!=null||s.jpick!=null||s.ipick!=null?`<button class=sm2 onclick="s.pick=null;s.jpick=null;s.ipick=null;s.fpick=null;s.mul=[];R()">取消</button>`:''}<button class=go ${s.pick==null||(jc&&s.jpick==null)||(ic&&s.ipick==null)||(s.fev&&s.fpick==null)?'disabled':''} onclick="sub()">決定して半年進む</button></div>`;
 return h}
function end(){let r=s.endReason||'引退',dead=r=='病死',hist=s.log.filter(l=>l.k=='p'&&/辞令|就任|初当選/.test(l.t));
 return `<section class="cd hero"><div class=cvw><canvas id=cv2 width=48 height=48></canvas></div><div class=pf><h2>${dead?'政治家人生の終幕':'政治家人生の幕引き'}</h2><p>${esc(summaryText())}</p><p class=ttl2><span>${title()}</span>最終の政治力 <b>${power()}</b> <em class="rk r${prank(power())}">${prank(power())}</em></p>
<div class=kv><span>引退の理由</span><b>${esc(r)}</b><span>最終役職</span><b>${esc(s.lastPos||'—')}</b><span>通算当選</span><b>${s.terms}回</b><span>最高位の役職</span><b>${esc(topPost()||'—')}</b><span>当選/落選</span><b>${s.elec.filter(e=>e.win).length+1}回/${s.elec.filter(e=>!e.win&&!e.ret).length}回(初当選を含む)</b><span>史実を変えた出来事</span><b>${s.log.filter(l=>l.k=='if').length}件</b><span>同期(IF)の中で</span><b>${crank()}位/40人</b></div></div></section>
<section class=cd><h3>就いた役職の履歴</h3>${Object.keys(s.sv).length?`<div class=pl>${Object.keys(s.sv).map(id=>`<div class=pi><div><b>${nm(id)}</b><small>${grp(id)}</small></div><div class=ps>${s.sv[id]}年</div></div>`).join('')}</div>`:'<p class=mu>なし</p>'}<details><summary>辞令の記録(${hist.length}件)</summary><ul class=ls>${hist.map(l=>`<li><b>${l.y}年${half(l.h)}</b> ${esc(l.t)}</li>`).join('')}</ul></details></section>
<section class=cd><h3>実績 <small>${Object.keys(s.ach||{}).length}/${ACH.length}</small></h3><div class=ach>${ACH.map(a=>{let g=(s.ach||{})[a[0]];return `<div class="ac${g?' got':''}"><b>${a[1]}</b><small>${g?g+'に獲得':a[2]}</small></div>`}).join('')}</div></section>
<section class=cd><div class=row><button class=go onclick="s=null;R()">タイトルへ戻る</button><button onclick="careerOut()">経歴をテキストで出力</button>${!s.final?`<button onclick="s.end=0;R()">引退後の生活を続ける</button>`:''}<button onclick="go(8)">年表を見る</button></div><textarea id=ctx hidden readonly aria-label="経歴のテキスト"></textarea></section>`}

/* 3. 選挙 */
function elec(){let o=pfo(s.pf);
 let h=`<section class=cd><h3>次の衆議院総選挙</h3><div class=kv><span>時期</span><b>${eLabel()}</b><span>次の参院選</span><b>${uLabel()}</b><span>選挙制度</span><b>${eNext().k<1995?'中選挙区制(1選挙区から複数人が当選。あなたの区の定数は'+mdm()+'・ゲーム上の目安)':'小選挙区比例代表並立制(1994年の政治改革関連法)'}</b><span>あなたの選挙区</span><b>${esc(dname())}</b></div>
<p class=mu>当選の見込みはおもに地元地盤で決まります。地元地盤が高ければ党の風に左右されず安定して当選でき、低いと党勢しだいで当落が分かれます。知名度・政治資金・選挙戦略も影響します。<b>いまの当選の見込み:約${s.ret?'—':Math.round(winP(suppZ()+(s.out?.05:0))*100)+'%'}</b>(党勢${s.w>0?'+':''}${s.w}・地元地盤${s.st.b}・自動の応援を含み、選挙戦略は含まない場合)。小選挙区で負けても、惜敗率が高ければ比例代表で復活当選できます(1996年以降)。</p></section>`;
 if(!s.ret)h+=`<details class=cd><summary><b>選挙区を変更する</b></summary><p class=mu>国替えすると地元地盤が6割下がります。</p><div class=row><select id=mpf onchange="fillDn('mdn',this.value,1)">${PF.map(p=>`<option${p.n==s.pf?' selected':''}>${p.n}</option>`).join('')}</select><select id=mdn></select><button onclick="moveDist()">この選挙区に移る</button></div></details>`;
 h=(s.msg?`<div class=al>${esc(s.msg)}</div>`:'')+h+etimeUI()+`<section class=cd><h3>自民党の議席の推移</h3>${seatChart()}</section>`;h+=`<h3 class=sh>総選挙の結果</h3>`;
 if(!s.elec.length)h+='<p class=mu>まだ総選挙は行われていません。最初は1983年後半です。</p>';
 h+=s.elec.slice().reverse().map(e=>{let st=Math.round(e.N*.5247),ab=Math.round(e.N*.5605),me=e.ret?'<p>引退中のため出馬せず</p>':`<div class=kv>${e.ind?'<span>立候補</span><b>無所属(党の公認なし)</b>':''}<span>結果</span><b class=${e.win?'ok':'wn'}>${e.rv?'比例復活で当選':e.win?'当選':'落選'}${e.win?'('+e.terms+'期目)':''}</b><span>選挙戦略</span><b>${e.stg}</b>${e.vt?`<span>投票率</span><b>${e.vt}%</b><span>得票</span><b>${(e.votes||0).toLocaleString()}票(${e.share}%)</b>`:''}${e.mid&&e.M?`<span>順位</span><b>${e.rank}位/定数${e.M}・候補${e.cand}人</b>`:''}${e.op?`<span>${esc(e.opn||'対立候補(IF人物)')}</span><b>${(e.ov||0).toLocaleString()}票(${e.op}%)</b>`:''}${e.sek&&!e.win||e.rv?`<span>惜敗率</span><b>${e.sek}%</b>`:''}<span>当選見込み</span><b>${e.p}%</b></div>`;
  return `<section class=cd><h3>${e.dt?e.dt+'の総選挙':Math.floor(e.k)+'年'+half(e.k%1)+'の総選挙'+(e.kind=='dis'?'(IF:首相の解散)':e.kind=='moved'?'(IF:時期変更)':'(推定日程)')} <small>${e.mid?'中選挙区制':'小選挙区比例代表並立制'}</small></h3>
<div class=two><div class=hbx>${tag('史実')}<p>${e.hs?(e.kind&&e.kind!='hist'?`この選挙はIFで時期が変わっています。史実では${esc(e.hdt)}に実施(自民党${e.hs}議席)`:`自民党 <b>${e.hs}</b>議席`+(EN[e.hk||e.k]?`<br><small>${EN[e.hk||e.k]}</small>`:'')):'史実データなし(推定日程の選挙)'}</p></div>
<div class=ibx>${tag('IF')}<p class=sm3>IFシミュレーション上の結果</p><p>自民党 <b>${e.sim}</b>/${e.N}議席 → ${e.r?'与党':'野党'}</p>${e.cpn?`<p class=sm3>連立相手:${esc(e.cpn)}(${e.cps}議席${e.cpe?'・推定':''})・連立で計${e.sim+e.cps}議席</p>`:''}${e.dev?`<p class=sm3>党勢の影響で史実より${Math.abs(e.dev)}議席${e.dev>0?'増':'減'}</p>`:''}<ul class=th><li class=${e.sim>=e.maj?'ok':''}>過半数 ${e.maj}</li><li class=${e.sim>=st?'ok':''}>安定多数 ${st}</li><li class=${e.sim>=ab?'ok':''}>絶対安定多数 ${ab}</li></ul></div></div>
<h4>あなたの選挙 ${tag('IF')}</h4>${me}<p class=nt>得票数・投票率・対立候補はゲーム上の数値(IF)で、実在の人物・記録ではありません。安定多数などは定数に対する目安です。</p></section>`}).join('');
 if(s.up&&s.up.length)h+=`<h3 class=sh>参議院選挙</h3>`+s.up.slice().reverse().map(u=>`<section class=cd><h3>${u.dt?u.dt+'の参院選':Math.floor(u.k)+'年'+half(u.k%1)+'の参院選(推定日程)'}</h3><div class=two><div class=hbx>${tag('史実')}<p>${esc(u.nt||'')}${u.txt?(u.nt?'<br>':'')+esc(u.txt):''}${!u.nt&&!u.txt?'推定日程の選挙(史実データなし)':''}</p></div><div class=ibx>${tag('IF')}<p>自民党の獲得 ${u.seats}議席(推定)・${u.good?'優勢':'劣勢'}${u.nj?'・ねじれ国会':''}</p></div></div></section>`).join('');
 return h}

/* 4〜7. 役職 */
function grp(id){return /^kt/.test(id)?'国会対策委員会':/^(sk|sec)/.test(id)?'幹事長室・党務':/^pr/.test(id)?'政務調査会':/^so/.test(id)?'総務会':/^c\d/.test(id)?'委員会':/^(sp|dp)$/.test(id)?'正副議長':/^f\d/.test(id)?'派閥の役職':'政府役職'}
function posts(t){let ls=PS.filter(p=>p.t==t),gs=[...new Set(ls.map(p=>grp(p.id)))];
 let h=stNote()+(s.msg?`<div class=al>${esc(s.msg)}</div>`:'')+`<section class=cd><div class=kv><span>現在の役職</span><b>${s.pos[t]?pname(s.pos[t])+tenTxt(s.pos[t])+` <button class=sm2 onclick="resign('${t}')">途中辞任</button>`:'なし'}</b><span>人事希望</span><b>${s.want?nm(s.want)+` <button class=sm2 onclick="wcancel()">取り下げ</button>`:s.asked?'このターンは提出済み':'未提出(1ターンに1件)'}</b></div><div class=kv><span>次の人事</span><b>${jLabel()}</b></div><p class=mu>役職は節目(内閣発足・内閣改造・総裁交代・総選挙後)ごとに総裁が決めます。希望を出さなくても何らかの役職に就きますが、今の役職も安泰ではなく、評価しだいで別の役職に移ることもあります。希望を出すとその役職に就ける可能性が上がり、党内影響力・人脈・派閥信頼度・派閥の影響力が高いほど良い役職に就けます。途中辞任すると数値が下がり、次の節目まで無役です。派閥役職と衆議院の正副議長は希望を出した場合だけ審査されます。</p></section>`;
 gs.forEach(g=>{h+=`<h3 class=sh>${g}</h3><div class=pl>`+ls.filter(p=>grp(p.id)==g).map(p=>{let m=ck(p),on=s.pos[t]==p.id,w=s.want==p.id;
  return `<div class="pi${on?' on':''}${m&&!on?' ng':''}"><div><b>${p.n}</b><small>${p.a}期〜${REQ[p.id]?' ・ '+reqTxt(p.id):''}</small></div><div class=ps>${on?'<span class=bdg>就任中</span>':w?'<span class="bdg w">希望提出中</span>':m?`<small>× ${m}</small>`:s.asked?'<small>今ターンは提出済み</small>':`<button onclick="ask('${p.id}')">希望を出す</button>${conf(p)?`<small>就任すると${conf(p)}を離れます</small>`:''}`}</div></div>`}).join('')+'</div>'});
 return h}

 if((P.d=='sp'||P.d=='dp')&&p.t!='d')add('d');return [...new Set(L)].join('・')}

function simSeats(k,en,hs,N){k=+k;let base=N*.5;if(en.kind=='hist'){let dv=cl(-1,1,s.w/10),v=Math.round(hs*(1+.2*dv))+R0(-2,2),nd=String(en.hk)=='1993.5'?240:Math.round(N*.4),lost=String(en.hk)=='1993.5'||String(en.hk)=='2009.5';v=cl(Math.round(hs*.8),Math.round(hs*1.2),v);return v}
 let near=HK.reduce((a,h)=>Math.abs(h-k)<Math.abs(a-k)?h:a,HK[0]),dist=Math.abs(near-k),hn=(ELEC[String(near)]||base)*N/seatsN(String(near)),f=Math.max(0,1-dist/2),pmb=s.pos.g=='pm'?(s.st.k+s.st.i)/25:0;

function bscene(){if(!s||s.end||s.ret)return'calm';if(s.pos.g=='pm')return'grand';if(isE(String(ky())))return'tense';return'main'}
setInterval(()=>{if(!AC||!SND.on||!SND.bgm||AC.state!='running')return;let sc=bscene(),T=BGM[sc],sd=60/T.bpm/2;
 if(seq.tr!=sc){seq.tr=sc;seq.step=0;seq.next=AC.currentTime+.15}if(seq.next<AC.currentTime-.1)seq.next=AC.currentTime+.05;
 while(seq.next<AC.currentTime+.3){let i=seq.step%T.m.length;tone(seq.next,T.m[i],sd*1.6,T.mt,T.mt=='square'?.03:.06);tone(seq.next,T.b[i],sd*1.8,'triangle',.07);seq.next+=sd;seq.step++}},60);
function sndUI(){const ck=(k,l,d)=>`<label class="o${SND[k]?' sel':''}"><input type=checkbox ${SND[k]?'checked':''} onchange="sndSet('${k}',this.checked)"><span class=ot><span><b>${l}</b></span><span class=hn><i class=nt>${d}</i></span></span></label>`;
 return `<h2>音と表示の設定</h2>${ck('rep','結果レポート','「決定」のたびに半年の結果をまとめて表示します')}${ck('on','音を鳴らす','オフにするとBGMも効果音も止まります')}${ck('bgm','BGM','通常・選挙前・首相在任中・タイトル/引退後で曲が変わります')}${ck('se','効果音','選択・決定・当選・落選・就任など')}<label class=vol>音量<input type=range id=vol min=0 max=1 step=.05 value="${SND.vol}" oninput="sndSet('vol',+this.value)"></label><p class=nt>音はこのページの中で合成しています(外部の音源ファイルは使いません)。ブラウザの仕組み上、画面を一度タップしてから鳴り始めます。スマートフォンはマナーモードだと鳴らないことがあります。</p>`}
function sndSet(k,v){SND[k]=v;try{localStorage.setItem('ng_snd',JSON.stringify(SND))}catch(e){}
 if(k=='vol'){if(MG)MG.gain.value=v;return}
 if(SND.on){acInit();seq.tr=null;if(k=='on'&&v)sfx('ok')}else if(AC)AC.suspend();rm();if(s)R();else{let a=$('app');if(a)R()}}
document.addEventListener('pointerdown',()=>{if(SND.on)acInit()});
document.addEventListener('click',e=>{let b=e.target.closest('button,input[type=radio]');if(b&&!b.classList.contains('go')&&!b.closest('#modal'))sfx('tab')},true);
R();try{if(!localStorage.getItem('ng_tut'))openM('tut')}catch(e){}
