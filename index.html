 h+=`<section class="cd ev"><div class=et>${hist?tag('史実'):est?tag('推定'):e.sel?tag('史実'):''}<h2>${esc(e.t)}</h2></div>

${(()=>{let ab=allBlk(e);return e.o.map((o,i)=>{let b=ab?[]:blk(o[1]);return `<label class="o${s.pick===i?' sel':''}${b.length?' dis':''}"><input type=radio name=q ${s.pick===i?'checked':''} ${b.length?'disabled':''} onclick="pk(${i})"><span class=lt>${L[i]}</span><span class=ot><span>${esc(o[0])}</span>${hint(o[1])}${b.length?`<span class=xn>選べません:${b.join('・')}が0です</span>`:''}</span></label>`}).join('')+(ab?'<p class=nt>すべての選択肢で0のステータスが下がるため、今回は特例ですべて選べます。</p>':'')})()}
<p class=nt>※矢印は主な影響の方向です。実際の結果は情勢や運で変わります。</p></section>`;
 if(jc)h+=`<section class="cd job"><h3>${esc(jc.t)} <small>(1つ選択)</small></h3><p class=mu>役職に就いている間は、毎ターンその立場ならではの行動を選べます。</p>${optList('jc',jc.o,s.jpick,'jp')}</section>`;
 if(isE(k)&&!s.ret)h+=`<section class=cd><h3>選挙戦略 <small>(1つ選択)</small></h3>${(()=>{if(STG[s.stg||0][2]>0&&s.st.m<=0)s.stg=6;return STG.map((g,i)=>{let d=g[2]>0&&s.st.m<=0;return `<label class="o${(s.stg||0)==i?' sel':''}${d?' dis':''}"><input type=radio name=sg ${(s.stg||0)==i?'checked':''} ${d?'disabled':''} onclick="s.stg=${i};R()"><span class=ot><span><b>${g[0]}</b> <small>${g[2]?'資金-'+g[2]:'資金なし'}</small></span><span class=hn><i class=nt>${g[1]}</i></span>${d?'<span class=xn>選べません:政治資金が0です</span>':''}</span></label>`}).join('')})()}</section>`;
 h+=`<section class=cd><h3>追加の活動 <small>(1つだけ・任意)</small></h3><label class="o${s.mul.length?'':' sel'}"><input type=radio name=m ${s.mul.length?'':'checked'} onclick="tg(-1)"><span class=ot><span>追加の活動はしない</span></span></label>${M.map((m,i)=>{if(i==3&&s.out)return'';let b=blk(m[1]);return `<label class="o${s.mul[0]===i?' sel':''}${b.length?' dis':''}"><input type=radio name=m ${s.mul[0]===i?'checked':''} ${b.length?'disabled':''} onclick="tg(${i})"><span class=ot><span>${m[0]}</span>${hint(m[1])}${b.length?`<span class=xn>選べません:${b.join('・')}が0です</span>`:''}</span></label>`}).join('')}</section>`;
 h+=`<div class=db><div class=ds>${(()=>{let nd=[];if(s.pick==null)nd.push('政策課題');if(jc&&s.jpick==null)nd.push('役職の仕事');if(ic&&s.ipick==null)nd.push('出来事');return nd.length?`<b class=wn>未選択:${nd.join('・')}</b>`:`選択:<b>${L[s.pick]}</b>${jc?` ＋ 仕事${L[s.jpick]}`:''}${ic?` ＋ 出来事${L[s.ipick]}`:''}${s.mul.length?` ＋ ${M[s.mul[0]][0]}`:''}${isE(k)&&!s.ret?` ＋ ${STG[s.stg||0][0]}`:''}`})()}</div>${s.pick!=null||s.jpick!=null||s.ipick!=null?`<button class=sm2 onclick="s.pick=null;s.jpick=null;s.ipick=null;s.mul=[];R()">取消</button>`:''}<button class=go ${s.pick==null||(jc&&s.jpick==null)||(ic&&s.ipick==null)?'disabled':''} onclick="sub()">決定して半年進む</button></div>`;
 return h}

/* 3. 選挙 */
function elec(){let o=pfo(s.pf);
 let h=`<section class=cd><h3>次の衆議院総選挙</h3><div class=kv><span>時期</span><b>${eLabel()}</b><span>次の参院選</span><b>${uLabel()}</b><span>選挙制度</span><b>${eNext().k<1995?'中選挙区制(1選挙区から複数人が当選)':'小選挙区比例代表並立制(1994年の政治改革関連法)'}</b><span>あなたの選挙区</span><b>${esc(dname())}</b></div>
<p class=mu>当選の見込みは、選挙基盤・地元関係・知名度・政治資金・党勢・選挙戦略で決まります。小選挙区で負けても、惜敗率が高ければ比例代表で復活当選できます(1996年以降)。</p></section>`;
 if(!s.ret)h+=`<details class=cd><summary><b>選挙区を変更する</b></summary><p class=mu>国替えすると地元関係が7割、選挙基盤が4割下がります。</p><div class=row><select id=mpf onchange="fillDn('mdn',this.value,1)">${PF.map(p=>`<option${p.n==s.pf?' selected':''}>${p.n}</option>`).join('')}</select><select id=mdn></select><button onclick="moveDist()">この選挙区に移る</button></div></details>`;
 h=(s.msg?`<div class=al>${esc(s.msg)}</div>`:'')+h+etimeUI()+`<section class=cd><h3>自民党の議席の推移</h3>${seatChart()}</section>`;h+=`<h3 class=sh>総選挙の結果</h3>`;
 if(!s.elec.length)h+='<p class=mu>まだ総選挙は行われていません。最初は1983年後半です。</p>';
 h+=s.elec.slice().reverse().map(e=>{let st=Math.round(e.N*.5247),ab=Math.round(e.N*.5605),me=e.ret?'<p>引退中のため出馬せず</p>':`<div class=kv>${e.ind?'<span>立候補</span><b>無所属(党の公認なし)</b>':''}<span>結果</span><b class=${e.win?'ok':'wn'}>${e.rv?'比例復活で当選':e.win?'当選':'落選'}${e.win?'('+e.terms+'期目)':''}</b><span>選挙戦略</span><b>${e.stg}</b>${e.vt?`<span>投票率</span><b>${e.vt}%</b><span>得票</span><b>${(e.votes||0).toLocaleString()}票(${e.share}%)</b>`:''}${e.mid&&e.M?`<span>順位</span><b>${e.rank}位/定数${e.M}・候補${e.cand}人</b>`:''}${e.op?`<span>${esc(e.opn||'対立候補(IF人物)')}</span><b>${(e.ov||0).toLocaleString()}票(${e.op}%)</b>`:''}${e.sek&&!e.win||e.rv?`<span>惜敗率</span><b>${e.sek}%</b>`:''}<span>当選見込み</span><b>${e.p}%</b></div>`;
  return `<section class=cd><h3>${e.dt?e.dt+'の総選挙':Math.floor(e.k)+'年'+half(e.k%1)+'の総選挙'+(e.kind=='dis'?'(IF:首相の解散)':e.kind=='moved'?'(IF:時期変更)':'(推定日程)')} <small>${e.mid?'中選挙区制':'小選挙区比例代表並立制'}</small></h3>
<div class=two><div class=hbx>${tag('史実')}<p>${e.hs?(e.kind&&e.kind!='hist'?`この選挙はIFで時期が変わっています。史実では${esc(e.hdt)}に実施(自民党${e.hs}議席)`:`自民党 <b>${e.hs}</b>議席`+(EN[e.hk||e.k]?`<br><small>${EN[e.hk||e.k]}</small>`:'')):'史実データなし(推定日程の選挙)'}</p></div>
<div class=ibx>${tag('IF')}<p class=sm3>IFシミュレーション上の結果</p><p>自民党 <b>${e.sim}</b>/${e.N}議席 → ${e.r?'与党':'野党'}</p><ul class=th><li class=${e.sim>=e.maj?'ok':''}>過半数 ${e.maj}</li><li class=${e.sim>=st?'ok':''}>安定多数 ${st}</li><li class=${e.sim>=ab?'ok':''}>絶対安定多数 ${ab}</li></ul></div></div>
<h4>あなたの選挙 ${tag('IF')}</h4>${me}<p class=nt>得票数・投票率・対立候補はゲーム上の数値(IF)で、実在の人物・記録ではありません。安定多数などは定数に対する目安です。</p></section>`}).join('');
 if(s.up&&s.up.length)h+=`<h3 class=sh>参議院選挙</h3>`+s.up.slice().reverse().map(u=>`<section class=cd><h3>${u.dt?u.dt+'の参院選':Math.floor(u.k)+'年'+half(u.k%1)+'の参院選(推定日程)'}</h3><div class=two><div class=hbx>${tag('史実')}<p>${esc(u.nt||'')}${u.txt?(u.nt?'<br>':'')+esc(u.txt):''}${!u.nt&&!u.txt?'推定日程の選挙(史実データなし)':''}</p></div><div class=ibx>${tag('IF')}<p>自民党の獲得 ${u.seats}議席(推定)・${u.good?'優勢':'劣勢'}${u.nj?'・ねじれ国会':''}</p></div></div></section>`).join('');
 return h}

/* 4〜7. 役職 */
function grp(id){return /^kt/.test(id)?'国会対策委員会':/^(sk|sec)/.test(id)?'幹事長室・党務':/^pr/.test(id)?'政務調査会':/^so/.test(id)?'総務会':/^c\d/.test(id)?'委員会':/^(sp|dp)$/.test(id)?'正副議長':/^f\d/.test(id)?'派閥の役職':'政府役職'}
function posts(t){let ls=PS.filter(p=>p.t==t),gs=[...new Set(ls.map(p=>grp(p.id)))];
 let h=stNote()+(s.msg?`<div class=al>${esc(s.msg)}</div>`:'')+`<section class=cd><div class=kv><span>現在の役職</span><b>${s.pos[t]?pname(s.pos[t])+tenTxt(s.pos[t])+` <button class=sm2 onclick="resign('${t}')">途中辞任</button>`:'なし'}</b><span>人事希望</span><b>${s.want?nm(s.want)+` <button class=sm2 onclick="wcancel()">取り下げ</button>`:s.asked?'このターンは提出済み':'未提出(1ターンに1件)'}</b></div><div class=kv><span>次の人事</span><b>${jLabel()}</b></div><p class=mu>役職は節目(内閣発足・内閣改造・総裁交代・総選挙後)ごとに総裁が決めます。希望を出さなくても何らかの役職に就きますが、今の役職も安泰ではなく、評価しだいで留任・昇格・横滑り・降格があります。希望を出すとその役職に就ける可能性が上がり、党内影響力・人脈・派閥信頼度・派閥の影響力が高いほど良い役職に就けます。途中辞任すると数値が下がり、次の節目まで無役です。派閥役職と衆議院の正副議長は希望を出した場合だけ審査されます。</p></section>`;
 gs.forEach(g=>{h+=`<h3 class=sh>${g}</h3><div class=pl>`+ls.filter(p=>grp(p.id)==g).map(p=>{let m=ck(p),on=s.pos[t]==p.id,w=s.want==p.id;
  return `<div class="pi${on?' on':''}${m&&!on?' ng':''}"><div><b>${p.n}</b><small>${p.a}期〜${p.z==99?'':(p.id=='g1'&&s.y>=2001?3:p.z)+'期'}</small></div><div class=ps>${on?'<span class=bdg>就任中</span>':w?'<span class="bdg w">希望提出中</span>':m?`<small>× ${m}</small>`:s.asked?'<small>今ターンは提出済み</small>':`<button onclick="ask('${p.id}')">希望を出す</button>${conf(p)?`<small>就任すると${conf(p)}を離れます</small>`:''}`}</div></div>`}).join('')+'</div>'});
 return h}
function party(){return `<section class=cd><p class=mu>今どの役職にいても、就任要件を満たす役職には希望を出せます。政府の役職に就くと党の役職と国会の役職を離れ、党の役職に就くと政府の役職を離れます。党の役職は同時に1つまでです。</p></section>`+posts('p')}
function gov(){return `<section class=cd><h3>政権の状況</h3><div class=kv><span>内閣総理大臣</span><b>${esc(pm())}</b><span>自民党</span><b>${s.ruling?'与党':'野党(政府役職には就けません)'}</b><span>国会の構成</span><b>${s.minor?'少数与党(IF推定)':'—'}${s.nejire?'・ねじれ国会(IF推定)':''}</b></div><p class=mu>首相になるには、6期以上・閣僚経験ありで総裁選に立候補し、党内影響力・派閥信頼度・党内人脈・知名度と派閥の影響力で勝つ必要があります。勝てば首班指名を経て就任します(IF)。与党でなくなる、または総裁選で敗れると退任します。</p></section>`+etimeUI()+posts('g')}
function diet(){return `<section class=cd><h3>衆議院議長のルール</h3><ul class=ls><li>政府の政策決定に直接関与しません</li><li>党務・派閥運営・党派的な選挙活動から距離を置きます</li><li>与野党の協議が行き詰まったときは仲介役になれます(政府や委員会を指揮はしません)</li><li>衆議院の解散で議長の任期は終わります</li></ul><div class=kv><span>国対経験(委員長代理含む)</span><b>${kt()}年</b><span>国対委員長・幹事長・総務会長</span><b>通算${ex()}年(議長要件は2年)</b></div></section>`+posts('d')}
function fac(){if(s.fac==5)return `<section class=cd><h3>無派閥</h3><p class=mu>派閥に入ると人事や総裁選で後ろ盾が得られます。</p><div class=row><select id=mvf>${FA.slice(0,5).map((x,i)=>`<option value=${i}>${x}</option>`).join('')}</select><button onclick="fa(3)">この派閥に入る</button></div></section>`;
 let f=s.fc;return (s.msg?`<div class=al>${esc(s.msg)}</div>`:'')+`<section class=cd><h3><i class=dot style="background:${FCOL[s.fac]}"></i>${FA[s.fac]}</h3><p class=mu>${FAD[s.fac]}</p>
<div class=kv><span>所属議員数</span><b>${f.mem}人 ${tag('IF')}<small>(ゲーム内の数値・選挙結果で増減)</small></b><span>総裁選での投票方針</span><b>${f.coh>=55?'派閥として一致して投票':f.coh>=35?'主流派に同調する傾向':'自主投票の傾向'}</b><span>党役員人事への影響力</span><b>${lv(f.inf)}</b></div>
<div class=sl><span>派閥の影響力</span><b>${f.inf}</b></div>${bar(f.inf)}<div class=sl><span>派閥の結束</span><b>${f.coh}</b></div>${bar(f.coh)}<div class=sl><span>他派閥との関係</span><b>${f.rel||50}</b></div>${bar(f.rel||50)}<div class=sl><span>あなたへの信頼(派閥信頼度)</span><b>${s.st.f}</b></div>${bar(s.st.f)}</section>
<section class=cd><h3>派閥の活動 <small>(1ターンに1回・${s.fa?'実施済み':'未実施'})</small></h3><div class=ag>
<button ${s.fa?'disabled':''} onclick="fa(0)"><b>結束強化</b><small>資金-5</small></button><button ${s.fa?'disabled':''} onclick="fa(1)"><b>勢力拡大</b><small>資金-8</small></button><button ${s.fa?'disabled':''} onclick="fa(2)"><b>他派閥と協議</b><small>人脈+</small></button><button ${s.fa?'disabled':''} onclick="fa(4)"><b>若手の育成</b><small>資金-4</small></button></div></section>

<section class=cd><h3>実績 <small>${Object.keys(s.ach||{}).length}/${ACH.length}</small></h3><div class=ach>${ACH.map(a=>{let g=(s.ach||{})[a[0]];return `<div class="ac${g?' got':''}"><b>${a[1]}</b><small>${g?g+'に獲得':a[2]}</small></div>`}).join('')}</div></section>
<section class=cd><h3>役職歴(在任年数)</h3>${pp.length?`<div class=pl>${pp.map(p=>`<div class=pi><div><b>${p.n}</b><small>${grp(p.id)}</small></div><div class=ps>${s.sv[p.id]}年</div></div>`).join('')}</div>`:'<p class=mu>まだありません</p>'}</section>
